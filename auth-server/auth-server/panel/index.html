<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-UA-Compatible" content="IE=edge">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Nexus Auth Panel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#e0e0e0;font-family:'Segoe UI',sans-serif;min-height:100vh}
.hidden{display:none!important}

/* Login */
#login-page{display:flex;align-items:center;justify-content:center;min-height:100vh}
.login-box{background:#12101e;border:1px solid #3a2060;border-radius:12px;padding:40px;width:360px}
.login-box h1{color:#8a48e6;text-align:center;margin-bottom:8px;font-size:24px}
.login-box p{text-align:center;color:#666;margin-bottom:28px;font-size:13px}
.form-group{margin-bottom:16px}
.form-group label{display:block;margin-bottom:6px;font-size:13px;color:#aaa}
.form-group input{width:100%;padding:10px 14px;background:#1a1530;border:1px solid #3a2060;border-radius:8px;color:#e0e0e0;font-size:14px;outline:none}
.form-group input:focus{border-color:#8a48e6}
.btn{width:100%;padding:11px;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s}
.btn-primary{background:#8a48e6;color:#fff}
.btn-primary:hover{background:#7035c8}
.btn-danger{background:#c0392b;color:#fff;padding:6px 12px;font-size:12px;border-radius:6px}
.btn-warning{background:#e67e22;color:#fff;padding:6px 12px;font-size:12px;border-radius:6px}
.btn-sm{padding:5px 10px;font-size:12px;border-radius:5px;border:none;cursor:pointer;font-weight:600}
.error-msg{color:#e74c3c;font-size:12px;margin-top:8px;text-align:center}

/* Dashboard */
#dashboard{display:flex;flex-direction:column;min-height:100vh}
.topbar{background:#12101e;border-bottom:1px solid #2a1850;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between}
.topbar .logo{color:#8a48e6;font-weight:700;font-size:18px}
.topbar .user{font-size:13px;color:#999}
.topbar .logout{background:transparent;border:1px solid #3a2060;color:#aaa;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px}
.topbar .logout:hover{background:#1a1530}

.layout{display:flex;flex:1}
.sidebar{width:200px;background:#0e0c1a;border-right:1px solid #1e1535;padding:16px 0}
.sidebar a{display:block;padding:10px 20px;color:#888;text-decoration:none;font-size:13px;transition:all .2s}
.sidebar a:hover,.sidebar a.active{color:#8a48e6;background:#1a1535}

.main{flex:1;padding:24px;overflow-y:auto}
.page{display:none}
.page.active{display:block}
.page-title{font-size:20px;font-weight:700;color:#c0a0ff;margin-bottom:20px}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:24px}
.stat-card{background:#12101e;border:1px solid #2a1850;border-radius:10px;padding:20px}
.stat-card .label{font-size:12px;color:#666;margin-bottom:6px}
.stat-card .value{font-size:28px;font-weight:700;color:#8a48e6}

/* Controls */
.controls{display:flex;gap:12px;margin-bottom:16px;flex-wrap:wrap;align-items:center}
.controls select,.controls input{background:#1a1530;border:1px solid #3a2060;border-radius:6px;color:#e0e0e0;padding:7px 12px;font-size:13px;outline:none}
.controls select:focus,.controls input:focus{border-color:#8a48e6}

/* Table */
.table-wrap{overflow-x:auto;background:#12101e;border:1px solid #2a1850;border-radius:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:12px 16px;text-align:left;color:#888;border-bottom:1px solid #1e1535;font-weight:600;white-space:nowrap}
td{padding:11px 16px;border-bottom:1px solid #150f28;color:#ccc;white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:#160f2a}

.badge{display:inline-block;padding:3px 8px;border-radius:4px;font-size:11px;font-weight:700}
.badge-active{background:#1a4a1a;color:#4caf50}
.badge-used{background:#1a3a4a;color:#2196f3}
.badge-expired{background:#3a2a1a;color:#ff9800}
.badge-suspended{background:#3a1a1a;color:#f44336}
.badge-revoked{background:#2a1a1a;color:#9e9e9e}
.badge-lifetime{background:#2a1a4a;color:#9c27b0}

/* Modal */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:1000}
.modal{background:#12101e;border:1px solid #3a2060;border-radius:12px;padding:32px;width:420px;max-width:95vw}
.modal h2{color:#c0a0ff;margin-bottom:20px;font-size:18px}
.modal .form-group{margin-bottom:14px}
.modal .actions{display:flex;gap:10px;margin-top:20px;justify-content:flex-end}

/* Pagination */
.pagination{display:flex;gap:8px;margin-top:16px;align-items:center;justify-content:flex-end}
.pagination button{background:#1a1530;border:1px solid #3a2060;color:#aaa;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.pagination button:hover{background:#2a1850}
.pagination button:disabled{opacity:.4;cursor:default}
.pagination .page-info{font-size:13px;color:#666}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-page">
  <div class="login-box">
    <h1>NEXUS</h1>
    <p>Auth Management Panel</p>
    <div class="form-group">
      <label>Kullanıcı Adı</label>
      <input type="text" id="login-user" placeholder="admin" autocomplete="off">
    </div>
    <div class="form-group">
      <label>Şifre</label>
      <input type="password" id="login-pass" placeholder="••••••••" autocomplete="off">
    </div>
    <button class="btn btn-primary" id="btn-login">Giriş Yap</button>
    <div class="error-msg hidden" id="login-error"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dashboard" class="hidden">
  <div class="topbar">
    <div class="logo">⬡ NEXUS AUTH</div>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="user" id="admin-name"></span>
      <button class="logout" id="btn-logout">Çıkış</button>
    </div>
  </div>
  <div class="layout">
    <div class="sidebar">
      <a href="#" class="active" data-page="licenses">Lisanslar</a>
      <a href="#" data-page="logs">Aktivite Logları</a>
    </div>
    <div class="main">

      <!-- LICENSES PAGE -->
      <div id="page-licenses" class="page active">
        <div class="page-title">Lisans Yönetimi</div>
        <div class="stats" id="stats-grid"></div>
        <div class="controls">
          <button class="btn btn-primary" style="width:auto;padding:8px 18px" id="btn-create-open">+ Lisans Oluştur</button>
          <select id="filter-status">
            <option value="">Tüm Durumlar</option>
            <option value="active">Aktif</option>
            <option value="used">Kullanımda</option>
            <option value="expired">Süresi Dolmuş</option>
            <option value="suspended">Askıda</option>
            <option value="revoked">İptal</option>
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Anahtar</th><th>Tür</th><th>Durum</th>
                <th>Oluşturulma</th><th>Aktivasyon</th><th>Bitiş</th>
                <th>İşlemler</th>
              </tr>
            </thead>
            <tbody id="license-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="lic-pagination"></div>
      </div>

      <!-- LOGS PAGE -->
      <div id="page-logs" class="page">
        <div class="page-title">Aktivite Logları</div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr><th>Zaman</th><th>Eylem</th><th>IP</th><th>Lisans</th><th>Detay</th></tr>
            </thead>
            <tbody id="logs-tbody"></tbody>
          </table>
        </div>
        <div class="pagination" id="log-pagination"></div>
      </div>

    </div>
  </div>
</div>

<!-- CREATE LICENSE MODAL -->
<div id="create-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2>Yeni Lisans Oluştur</h2>
    <div class="form-group">
      <label>Lisans Türü</label>
      <select id="lic-type" style="width:100%;background:#1a1530;border:1px solid #3a2060;border-radius:8px;color:#e0e0e0;padding:10px;font-size:14px">
        <option value="1d">1 Gün</option>
        <option value="3d">3 Gün</option>
        <option value="7d">7 Gün</option>
        <option value="30d">30 Gün</option>
        <option value="lifetime">Sınırsız</option>
      </select>
    </div>
    <div class="form-group">
      <label>Adet</label>
      <input type="number" id="lic-count" value="1" min="1" max="100" style="width:100%">
    </div>
    <div class="form-group">
      <label>Not (opsiyonel)</label>
      <input type="text" id="lic-note" placeholder="Müşteri adı vb." style="width:100%">
    </div>
    <div class="actions">
      <button class="btn btn-primary" style="width:auto;padding:9px 20px" id="btn-create-submit">Oluştur</button>
      <button class="btn" style="width:auto;padding:9px 20px;background:#1a1530;border:1px solid #3a2060" data-close="create-modal">İptal</button>
    </div>
    <div id="create-result" style="margin-top:14px;font-size:12px;color:#4caf50;word-break:break-all"></div>
  </div>
</div>

<!-- HWID RESET MODAL -->
<div id="hwid-modal" class="modal-overlay hidden">
  <div class="modal">
    <h2>HWID Sıfırla</h2>
    <p style="font-size:13px;color:#aaa;margin-bottom:16px">Kullanıcı yeni bir donanımda aktive edebilecek.</p>
    <div class="form-group">
      <label>Sebep (opsiyonel)</label>
      <input type="text" id="hwid-reason" placeholder="Donanım değişikliği vb." style="width:100%">
    </div>
    <input type="hidden" id="hwid-license-id">
    <div class="actions">
      <button class="btn btn-primary" style="width:auto;padding:9px 20px;background:#e67e22" id="btn-hwid-reset">Sıfırla</button>
      <button class="btn" style="width:auto;padding:9px 20px;background:#1a1530;border:1px solid #3a2060" data-close="hwid-modal">İptal</button>
    </div>
  </div>
</div>

<script src="js/panel.js" nonce="{{CSP_NONCE}}"></script>
</body>
</html>
